<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart | Kalyan Jewellers — Client Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Italiana&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/storefront.css" />
  <link rel="stylesheet" href="css/cart-checkout.css" />
  <link rel="stylesheet" href="css/demo.css" />
  <link rel="stylesheet" href="css/atc-demo.css" />
  <style>
    .font-helvetica-light { font-family: "Helvetica Neue LT Std 45 Light", "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 300; }
    .font-serif { font-family: "Helvetica Neue LT Std", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>
</head>
<body>
  <div class="demo-banner">S-ATC demo</div>
  <div id="site-header"></div>

  <!-- Cart page — cart.tsx + CartMain layout=page -->
  <div class="min-h-[70vh] bg-[#fdfaf5] px-4 py-10 sm:px-6 md:px-10 lg:px-16 2xl:px-20">
    <div class="mx-auto max-w-6xl">
      <section aria-label="Cart page" class="w-full">
        <div class="mb-8 flex flex-wrap items-end justify-between gap-4">
          <div>
            <p class="font-sans text-xs font-semibold uppercase tracking-[0.2em] text-[#cf254a]">Your Bag</p>
            <h1 class="mt-1 font-helvetica-light text-3xl text-gray-900 md:text-4xl">Shopping Cart</h1>
          </div>
          <p class="font-sans text-sm text-gray-500" id="cart-item-count"></p>
        </div>

        <div id="cart-empty" class="rounded-xl border border-[#efe8e0] bg-white px-6 py-14 text-center shadow-sm" hidden>
          <p class="font-sans text-base text-gray-600">
            Looks like you haven&rsquo;t added anything yet, let&rsquo;s get you started!
          </p>
          <a href="plp.html" class="mt-6 inline-flex items-center justify-center rounded-md bg-[#cf254a] px-6 py-3 font-sans text-sm font-semibold text-white transition hover:bg-[#a61e3d]">
            Continue shopping
          </a>
        </div>

        <div id="cart-filled" class="grid grid-cols-1 gap-8 lg:grid-cols-[minmax(0,1.5fr)_minmax(280px,0.85fr)] lg:gap-10" hidden>
          <div>
            <ul id="cart-lines" class="flex flex-col gap-4"></ul>
            <div class="mt-6 border-t border-[#efe8e0] pt-5">
              <a href="plp.html" class="inline-flex items-center gap-1 font-sans text-sm font-medium text-[#cf254a] transition hover:text-[#a61e3d]">← Continue Shopping</a>
            </div>
          </div>

          <div class="h-fit rounded-xl border border-[#efe8e0] bg-white p-5 shadow-sm sm:p-6 lg:sticky lg:top-28" aria-labelledby="summary">
            <h2 id="summary" class="font-helvetica-light text-xl text-gray-900 sm:text-2xl">Order Summary</h2>
            <dl class="mt-5 space-y-3 border-b border-[#efe8e0] pb-4 font-sans">
              <div class="flex items-center justify-between gap-3">
                <dt class="text-sm text-gray-600">Item total</dt>
                <dd class="text-base font-semibold text-gray-900" id="sum-subtotal">₹0.00</dd>
              </div>
              <div class="flex items-center justify-between gap-3">
                <dt class="text-sm text-gray-600">Order total</dt>
                <dd class="text-base font-semibold text-gray-900" id="sum-total">₹0.00</dd>
              </div>
            </dl>
            <p class="mt-3 font-sans text-xs text-gray-500">Taxes and shipping calculated at checkout.</p>
            <div class="mt-5 space-y-3">
              <div class="mb-1 flex items-center justify-between font-sans text-sm text-gray-600">
                <span>Apply Offer / Voucher</span>
                <button type="button" id="check-offers" class="font-semibold text-[#cf254a] hover:text-[#a61e3d]">Check Offers</button>
              </div>
              <div class="flex overflow-hidden rounded-md border border-[#e8ddd3] bg-white">
                <input type="text" id="offer-code" placeholder="Discount code" class="min-w-0 flex-1 bg-transparent px-3 py-2.5 font-sans text-sm outline-none" />
                <button type="button" id="apply-offer" class="shrink-0 border-l border-[#e8ddd3] px-4 py-2.5 font-sans text-sm font-semibold text-[#cf254a]">Apply</button>
              </div>
            </div>
            <p id="cart-check-msg" class="mt-4 font-sans text-sm text-[#cf254a]" hidden></p>
            <button
              type="button"
              id="checkout-btn"
              class="mt-6 flex w-full items-center justify-center rounded-md bg-[#cf254a] py-3.5 font-sans text-[15px] font-semibold text-white transition hover:bg-[#a61e3d]"
            >
              Proceed to Checkout
            </button>
            <button type="button" id="clear-cart" class="mt-3 w-full font-sans text-sm text-gray-500 underline">Clear cart</button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="js/atc-engine.js"></script>
  <script src="js/atc-contracts.js"></script>
  <script src="js/shared-header.js"></script>
  <script src="js/atc-ui.js"></script>
  <script>
    const emptyEl = document.getElementById('cart-empty');
    const filledEl = document.getElementById('cart-filled');
    const linesEl = document.getElementById('cart-lines');
    const checkoutBtn = document.getElementById('checkout-btn');
    const checkMsg = document.getElementById('cart-check-msg');

    function renderCart() {
      const lines = DemoCart.readCart();
      const st = DemoAtc.getState();
      DemoHeader.syncBadges(DemoCart.getCount());

      if (!lines.length) {
        emptyEl.hidden = false;
        filledEl.hidden = true;
        document.getElementById('cart-item-count').textContent = '';
        return;
      }

      emptyEl.hidden = true;
      filledEl.hidden = false;
      document.getElementById('cart-item-count').textContent =
        lines.length + (lines.length === 1 ? ' piece' : ' pieces');
      linesEl.innerHTML = '';

      lines.forEach((line) => {
        const flagged = line.unreserved || line.itemStatus === 'UNRESERVED' || line.itemStatus === 'NO_OM_ROW';
        const li = document.createElement('li');
        li.className = 'list-none';
        li.innerHTML = `
          <div class="rounded-xl border ${flagged ? 'border-[#cf254a] bg-[#fff6f7]' : 'border-[#efe8e0] bg-white'} p-4 shadow-sm sm:p-5">
            <div class="flex gap-4">
              <a href="pdp.html?handle=${line.handle}" class="h-20 w-20 shrink-0 overflow-hidden rounded-lg bg-[#fdfaf5] sm:h-24 sm:w-24">
                <img src="${line.image}" alt="${line.title}" class="h-full w-full object-cover" />
              </a>
              <div class="flex min-w-0 flex-1 flex-col">
                <div class="flex items-start justify-between gap-3">
                  <a href="pdp.html?handle=${line.handle}" class="min-w-0 font-sans text-[15px] font-medium leading-snug text-gray-900 hover:text-[#cf254a]">${line.title}</a>
                  <div class="shrink-0 text-right">
                    <div class="font-sans text-[15px] font-semibold text-gray-900">${DemoCart.formatINR(line.price)}</div>
                    ${line.originalPriceInr ? `<div class="font-sans text-[11px] text-gray-400 line-through">${DemoCart.formatINR(line.originalPriceInr)}</div>` : ''}
                  </div>
                </div>
                <ul class="mt-1 space-y-0.5">
                  <li class="font-sans text-xs text-gray-500">SKU: ${line.sku}</li>
                  <li class="font-sans text-xs text-gray-500">Barcode: ${line.barcode} · ${Number(line.weight).toFixed(2)} g · live sale, not SKU ₹48,700</li>
                  <li class="font-sans text-xs text-gray-500">Hold until ${line.expiresAt ? line.expiresAt.slice(11, 16) : '—'} · ${line.itemStatus || '—'}</li>
                  ${line.metalValueInr != null ? `<li class="font-sans text-xs text-gray-500">Breakup · Metal ${DemoCart.formatINR(line.metalValueInr)} · Stone ${DemoCart.formatINR(line.stoneDiamondValueInr || 0)} · Making ${DemoCart.formatINR(line.makingChargeAmountInr)} · Discount ${line.discountPercent}% / ${DemoCart.formatINR(line.discountAmountInr)}</li>` : ''}
                  ${flagged ? '<li class="atc-unheld">Unheld — resolve this row. Checkout stays off.</li>' : ''}
                </ul>
                <div class="mt-auto flex items-center justify-between gap-3 pt-3">
                  <span class="font-sans text-xs text-gray-500">1 piece (not a quantity)</span>
                  <span class="flex items-center gap-3">
                    ${flagged ? `<button type="button" data-resolve="${line.barcode}" data-sku="${line.sku}" class="font-sans text-sm font-semibold text-[#cf254a]">Resolve</button>` : ''}
                    <button type="button" data-remove="${line.barcode}" class="font-sans text-sm font-medium text-[#cf254a] transition hover:text-[#a61e3d]">Remove</button>
                  </span>
                </div>
              </div>
            </div>
          </div>`;
        linesEl.appendChild(li);
      });

      const sub = DemoCart.getSubtotal();
      document.getElementById('sum-subtotal').textContent = DemoCart.formatINR(sub);
      document.getElementById('sum-total').textContent = DemoCart.formatINR(sub);

      const on = DemoCart.checkoutEnabled();
      checkoutBtn.classList.toggle('opacity-55', !on);
      checkoutBtn.classList.toggle('cursor-not-allowed', !on);
      checkoutBtn.textContent = on ? 'Proceed to Checkout' : 'Checkout unavailable';
      let msg = st.lastCheck && st.lastCheck.message;
      if (on && !st.customerId) {
        msg = (msg ? msg + ' ' : '') + 'Guest — Checkout is on. The lock still needs CustomerId (S-CO-05).';
      } else if (on && st.customerId) {
        msg = (msg ? msg + ' ' : '') + 'Identified as ' + st.customerId + '.';
      }
      checkMsg.hidden = !msg;
      checkMsg.textContent = msg || '';
    }

    linesEl.addEventListener('click', (e) => {
      const t = e.target;
      if (!(t instanceof HTMLElement)) return;
      if (t.dataset.resolve) {
        DemoAtcUi.beginResolve(t.dataset.sku, t.dataset.resolve);
        return;
      }
      if (t.dataset.remove) {
        DemoAtcUi.removeRow(t.dataset.remove);
        renderCart();
      }
    });

    checkoutBtn.addEventListener('click', () => {
      DemoAtcUi.proceedCheckout();
      renderCart();
    });

    document.getElementById('check-offers').addEventListener('click', () => {
      location.href = 'offers.html';
    });
    document.getElementById('apply-offer').addEventListener('click', () => {
      DemoAtcUi.showOfferFinding();
    });

    document.getElementById('clear-cart').addEventListener('click', () => {
      DemoCart.readCart().forEach((line) => DemoAtc.releaseItem(line.barcode));
      DemoAtc.getCartDetails(true);
      renderCart();
    });

    const boot = DemoAtc.getState();
    if (boot.flags.autoValidateCart || boot.cartStatus === 'CHECKOUT_INITIATED' || boot.flags.pageNote) {
      DemoAtcUi.runCartPageCheck();
    }
    renderCart();
  </script>
</body>
</html>
